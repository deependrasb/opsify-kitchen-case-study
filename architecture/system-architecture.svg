<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Opsify Kitchen - System Architecture</title>
  <desc id="desc">Users connect to the Opsify Kitchen web application, which uses MySQL and integrates with payments, messaging, OAuth, e-invoicing, and a print bridge for thermal printers.</desc>

  <rect x="0" y="0" width="960" height="640" fill="#f7f5f1"/>

  <text x="40" y="42" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#1a2424">Opsify Kitchen - System Architecture</text>
  <text x="40" y="64" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3d4a4a">Logical view - no private infrastructure or secrets</text>

  <!-- Users -->
  <rect x="40" y="100" width="180" height="260" rx="8" fill="#eef3f1" stroke="#2c3a3a" stroke-width="1.25"/>
  <text x="56" y="124" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#1f6f5b">USERS</text>
  <rect x="56" y="140" width="148" height="32" rx="4" fill="#ffffff" stroke="#2c3a3a" stroke-width="1.5"/>
  <text x="68" y="161" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#1a2424">Owner / Manager</text>
  <rect x="56" y="182" width="148" height="32" rx="4" fill="#ffffff" stroke="#2c3a3a" stroke-width="1.5"/>
  <text x="68" y="203" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#1a2424">Cashier / POS</text>
  <rect x="56" y="224" width="148" height="32" rx="4" fill="#ffffff" stroke="#2c3a3a" stroke-width="1.5"/>
  <text x="68" y="245" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#1a2424">Waiter</text>
  <rect x="56" y="266" width="148" height="32" rx="4" fill="#ffffff" stroke="#2c3a3a" stroke-width="1.5"/>
  <text x="68" y="287" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#1a2424">Kitchen Staff</text>
  <rect x="56" y="308" width="148" height="32" rx="4" fill="#ffffff" stroke="#2c3a3a" stroke-width="1.5"/>
  <text x="68" y="329" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#1a2424">Guest / Diner</text>

  <!-- Application -->
  <rect x="300" y="100" width="360" height="260" rx="8" fill="#d8ebe4" stroke="#1f6f5b" stroke-width="1.25"/>
  <text x="316" y="124" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#1f6f5b">APPLICATION</text>
  <rect x="320" y="145" width="320" height="88" rx="6" fill="#ffffff" stroke="#2c3a3a" stroke-width="1.5"/>
  <text x="336" y="178" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#1a2424">Web MVC Application</text>
  <text x="336" y="198" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3d4a4a">Admin - POS - Kitchen - Waiter - Website</text>
  <rect x="320" y="250" width="150" height="80" rx="6" fill="#ffffff" stroke="#2c3a3a" stroke-width="1.5"/>
  <text x="336" y="285" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#1a2424">Waiter REST API</text>
  <text x="336" y="305" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3d4a4a">Companion clients</text>
  <rect x="490" y="250" width="150" height="80" rx="6" fill="#ffffff" stroke="#2c3a3a" stroke-width="1.5"/>
  <text x="506" y="285" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#1a2424">Print Bridge</text>
  <text x="506" y="305" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3d4a4a">ESC/POS jobs</text>

  <!-- Data -->
  <rect x="720" y="145" width="200" height="88" rx="6" fill="#ffffff" stroke="#2c3a3a" stroke-width="1.5"/>
  <text x="736" y="175" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#1f6f5b">DATA</text>
  <text x="736" y="200" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#1a2424">MySQL / MariaDB</text>
  <text x="736" y="218" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3d4a4a">System of record</text>

  <!-- Integrations -->
  <rect x="300" y="400" width="360" height="180" rx="8" fill="#eef3f1" stroke="#2c3a3a" stroke-width="1.25"/>
  <text x="316" y="424" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#1f6f5b">INTEGRATIONS</text>
  <rect x="316" y="440" width="160" height="50" rx="4" fill="#ffffff" stroke="#2c3a3a" stroke-width="1.5"/>
  <text x="328" y="462" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#1a2424">Payments</text>
  <text x="328" y="478" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3d4a4a">Stripe - PayPal - Razorpay</text>
  <rect x="490" y="440" width="150" height="50" rx="4" fill="#ffffff" stroke="#2c3a3a" stroke-width="1.5"/>
  <text x="502" y="462" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#1a2424">Messaging</text>
  <text x="502" y="478" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3d4a4a">Email - SMS - WhatsApp</text>
  <rect x="316" y="505" width="160" height="50" rx="4" fill="#ffffff" stroke="#2c3a3a" stroke-width="1.5"/>
  <text x="328" y="527" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#1a2424">OAuth</text>
  <text x="328" y="543" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3d4a4a">Google - Facebook</text>
  <rect x="490" y="505" width="150" height="50" rx="4" fill="#ffffff" stroke="#2c3a3a" stroke-width="1.5"/>
  <text x="502" y="527" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#1a2424">E-Invoicing</text>
  <text x="502" y="543" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3d4a4a">ZATCA (as required)</text>

  <!-- Printers -->
  <rect x="720" y="440" width="200" height="80" rx="6" fill="#ffffff" stroke="#2c3a3a" stroke-width="1.5"/>
  <text x="736" y="470" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#1f6f5b">HARDWARE</text>
  <text x="736" y="495" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#1a2424">Thermal Printers</text>
  <text x="736" y="512" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3d4a4a">Bill - KOT - Invoice</text>

  <!-- Connectors -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4a5c5c"/>
    </marker>
  </defs>
  <path d="M220 230 H300" stroke="#4a5c5c" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M640 189 H720" stroke="#4a5c5c" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M480 360 V400" stroke="#4a5c5c" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M565 330 V400" stroke="#4a5c5c" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M640 290 H690" stroke="#4a5c5c" stroke-width="1.5" fill="none"/>
  <path d="M690 290 V480 H720" stroke="#4a5c5c" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="40" y="600" width="12" height="12" rx="2" fill="#1f6f5b"/>
  <text x="60" y="611" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3d4a4a">Public showcase diagram - configuration and credentials remain private</text>
</svg>
