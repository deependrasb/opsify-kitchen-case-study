<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Opsify Kitchen  System Architecture</title>
  <desc id="desc">Users connect to the Opsify Kitchen web application, which uses MySQL and integrates with payments, messaging, OAuth, e-invoicing, and a print bridge for thermal printers.</desc>

  <defs>
    <style>
      .bg { fill: #f7f5f1; }
      .panel { fill: #ffffff; stroke: #2c3a3a; stroke-width: 1.5; }
      .panelSoft { fill: #eef3f1; stroke: #2c3a3a; stroke-width: 1.25; }
      .accent { fill: #1f6f5b; }
      .accentSoft { fill: #d8ebe4; stroke: #1f6f5b; stroke-width: 1.25; }
      .title { font-family: Georgia, 'Times New Roman', serif; font-size: 22px; fill: #1a2424; }
      .label { font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 13px; fill: #1a2424; }
      .small { font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 11px; fill: #3d4a4a; }
      .group { font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 12px; font-weight: 600; fill: #1f6f5b; }
      .line { stroke: #4a5c5c; stroke-width: 1.5; fill: none; }
      .arrow { fill: #4a5c5c; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="arrow"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="640"/>
  <text class="title" x="40" y="42">Opsify Kitchen  System Architecture</text>
  <text class="small" x="40" y="64">Logical view · No private infrastructure or secrets</text>

  <!-- Users -->
  <rect class="panelSoft" x="40" y="100" width="180" height="260" rx="8"/>
  <text class="group" x="56" y="124">USERS</text>
  <rect class="panel" x="56" y="140" width="148" height="32" rx="4"/>
  <text class="label" x="68" y="161">Owner / Manager</text>
  <rect class="panel" x="56" y="182" width="148" height="32" rx="4"/>
  <text class="label" x="68" y="203">Cashier / POS</text>
  <rect class="panel" x="56" y="224" width="148" height="32" rx="4"/>
  <text class="label" x="68" y="245">Waiter</text>
  <rect class="panel" x="56" y="266" width="148" height="32" rx="4"/>
  <text class="label" x="68" y="287">Kitchen Staff</text>
  <rect class="panel" x="56" y="308" width="148" height="32" rx="4"/>
  <text class="label" x="68" y="329">Guest / Diner</text>

  <!-- Application -->
  <rect class="accentSoft" x="300" y="100" width="360" height="260" rx="8"/>
  <text class="group" x="316" y="124">APPLICATION</text>
  <rect class="panel" x="320" y="145" width="320" height="88" rx="6"/>
  <text class="label" x="336" y="178">Web MVC Application</text>
  <text class="small" x="336" y="198">Admin · POS · Kitchen · Waiter · Website</text>
  <rect class="panel" x="320" y="250" width="150" height="80" rx="6"/>
  <text class="label" x="336" y="285">Waiter REST API</text>
  <text class="small" x="336" y="305">Companion clients</text>
  <rect class="panel" x="490" y="250" width="150" height="80" rx="6"/>
  <text class="label" x="506" y="285">Print Bridge</text>
  <text class="small" x="506" y="305">ESC/POS jobs</text>

  <!-- Data -->
  <rect class="panel" x="720" y="145" width="200" height="88" rx="6"/>
  <text class="group" x="736" y="175">DATA</text>
  <text class="label" x="736" y="200">MySQL / MariaDB</text>
  <text class="small" x="736" y="218">System of record</text>

  <!-- Integrations -->
  <rect class="panelSoft" x="300" y="400" width="360" height="180" rx="8"/>
  <text class="group" x="316" y="424">INTEGRATIONS</text>
  <rect class="panel" x="316" y="440" width="160" height="50" rx="4"/>
  <text class="label" x="328" y="462">Payments</text>
  <text class="small" x="328" y="478">Stripe · PayPal · Razorpay</text>
  <rect class="panel" x="490" y="440" width="150" height="50" rx="4"/>
  <text class="label" x="502" y="462">Messaging</text>
  <text class="small" x="502" y="478">Email · SMS · WhatsApp</text>
  <rect class="panel" x="316" y="505" width="160" height="50" rx="4"/>
  <text class="label" x="328" y="527">OAuth</text>
  <text class="small" x="328" y="543">Google · Facebook</text>
  <rect class="panel" x="490" y="505" width="150" height="50" rx="4"/>
  <text class="label" x="502" y="527">E-Invoicing</text>
  <text class="small" x="502" y="543">ZATCA (as required)</text>

  <!-- Printers -->
  <rect class="panel" x="720" y="440" width="200" height="80" rx="6"/>
  <text class="group" x="736" y="470">HARDWARE</text>
  <text class="label" x="736" y="495">Thermal Printers</text>
  <text class="small" x="736" y="512">Bill · KOT · Invoice</text>

  <!-- Connectors -->
  <path class="line" marker-end="url(#arrow)" d="M220 230 H300"/>
  <path class="line" marker-end="url(#arrow)" d="M640 189 H720"/>
  <path class="line" marker-end="url(#arrow)" d="M480 360 V400"/>
  <path class="line" marker-end="url(#arrow)" d="M565 330 V400"/>
  <path class="line" marker-end="url(#arrow)" d="M640 290 H700 Q720 290 720 440"/>
  <path class="line" marker-end="url(#arrow)" d="M565 330 H640"/>

  <rect class="accent" x="40" y="600" width="12" height="12" rx="2"/>
  <text class="small" x="60" y="611">Public showcase diagram  configuration and credentials remain private</text>
</svg>
